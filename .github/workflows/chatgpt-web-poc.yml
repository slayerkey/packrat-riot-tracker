name: ChatGPT Web proof of concept

on:
  push:
    branches:
      - chatgpt-web-poc-20260822
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install locked dependencies
        id: install
        continue-on-error: true
        run: npm ci

      - name: Build plugin
        id: build
        continue-on-error: true
        run: npm run build

      - name: Validate with Elgato CLI
        id: validate
        continue-on-error: true
        run: npx @elgato/cli validate com.packrat.riot-tracker.sdPlugin --no-update-check

      - name: Run host independent RatPack QA
        id: qa
        continue-on-error: true
        run: python scripts/web_poc_qa.py

      - name: Package Stream Deck plugin
        id: package
        continue-on-error: true
        run: npx @elgato/cli pack com.packrat.riot-tracker.sdPlugin --output dist --no-update-check

      - name: Write machine readable CI result
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          BUILD: ${{ steps.build.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          QA: ${{ steps.qa.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
        run: |
          mkdir -p poc
          python - <<'PY'
          import json, os
          from pathlib import Path
          steps = {k.lower(): os.environ[k] for k in ("INSTALL", "BUILD", "VALIDATE", "QA", "PACKAGE")}
          result = {
              "workflow": "ChatGPT Web proof of concept",
              "steps": steps,
              "all_passed": all(value == "success" for value in steps.values()),
          }
          Path("poc/ci-result.json").write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(result, indent=2))
          PY

      - name: Persist result for ChatGPT connector reads
        if: always() && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poc/ci-result.json
          if git diff --cached --quiet; then
            echo "Result unchanged"
          else
            git commit -m "Record ChatGPT Web POC CI result [skip ci]"
            git push
          fi

      - name: Upload release candidate and QA report
        if: steps.package.outcome == 'success' && steps.qa.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: riot-rank-tracker-web-poc
          path: |
            dist/*.streamDeckPlugin
            dist/web-poc-qa.json
          if-no-files-found: error

      - name: Fail if any gate failed
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          BUILD: ${{ steps.build.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          QA: ${{ steps.qa.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
        run: |
          for value in "$INSTALL" "$BUILD" "$VALIDATE" "$QA" "$PACKAGE"; do
            if [ "$value" != "success" ]; then
              exit 1
            fi
          done
