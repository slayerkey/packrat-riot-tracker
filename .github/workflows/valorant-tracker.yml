name: Valorant Tracker CI

on:
  push:
    branches:
      - product/valorant-tracker
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run fixture tests
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Validate with Elgato CLI
        run: npx @elgato/cli validate com.packrat.valorant-tracker.sdPlugin --no-update-check

      - name: Package Stream Deck plugin
        run: npx @elgato/cli pack com.packrat.valorant-tracker.sdPlugin --output dist --no-update-check

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: valorant-tracker-ci
          path: dist/*.streamDeckPlugin
          if-no-files-found: error
