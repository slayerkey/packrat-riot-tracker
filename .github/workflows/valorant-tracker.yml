name: Valorant Tracker CI

on:
  push:
    branches:
      - product/valorant-tracker
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install locked dependencies
        run: npm ci

      - name: Run fixture tests
        run: npm test

      - name: Build deterministic visual fixtures
        run: npm run visual:fixtures

      - name: Build bundled dashboard profiles
        run: python scripts/build_profiles.py

      - name: Validate dashboard profile definitions
        run: python scripts/profile_qa.py

      - name: Run RatPack structural QA
        run: python scripts/valorant_qa.py

      - name: Build plugin
        run: npm run build

      - name: Validate with Elgato CLI
        run: npx @elgato/cli validate com.packrat.valorant-tracker.sdPlugin --no-update-check

      - name: Package Stream Deck plugin
        run: npx @elgato/cli pack com.packrat.valorant-tracker.sdPlugin --output dist --no-update-check

      - name: Upload release candidate and QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: valorant-tracker-ci
          path: |
            dist/*.streamDeckPlugin
            dist/valorant-qa.json
            dist/visual-fixtures/*.svg
            com.packrat.valorant-tracker.sdPlugin/profiles/*.streamDeckProfile
          if-no-files-found: error

  platform-smoke:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install locked dependencies
        run: npm ci

      - name: Run fixture tests
        run: npm test

      - name: Build deterministic visual fixtures
        run: npm run visual:fixtures

      - name: Build bundled dashboard profiles
        run: python scripts/build_profiles.py

      - name: Validate dashboard profiles
        run: python scripts/profile_qa.py

      - name: Build plugin
        run: npm run build

      - name: Validate with Elgato CLI
        run: npx @elgato/cli validate com.packrat.valorant-tracker.sdPlugin --no-update-check
